# ─────────────────────────────────────────────────────────────────────────────
# config.yaml  –  Configuration for the GitHub profile README.
#
# Edit this file to personalise your README without touching any script.
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ────────────────────────────────────────────────────────────────
github_username: "fortune-c"
display_name:    "Fortunate Adesina"
title:           "Software Engineering Student"
location:        "Nigeria 🇳🇬"
bio:             "Building systems, writing C/C++, exploring the edges of graphics."
pronouns:        "he/him"

# ── Info-card rows (label: value, rendered in the terminal card) ────────────
info_rows:
  - label: "OS"
    value: "Ubuntu · Windows · Android"
  - label: "Shell"
    value: "zsh"
  - label: "Editor"
    value: "VSCode · Zed · Neovim"
  - label: "Stack"
    value: "C · C++ · Rust"
  - label: "Focus"
    value: "Low-level"
  - label: "Learning"
    value: "Computer Graphic · GPU Programming"
  - label: "Currently"
    value: "BSc Software Engineering @ Miva"
  - label: "Reading"
    value: "Computer Graphics: Principles and Practice"
  - label: "GitHub"
    value: "github.com/fortune-c"
  - label: "Twitter"
    value: "@fortunevm"
  - label: "LinkedIn"
    value: "linkedin.com/in/fortune-c"

# ── Terminal prompt shown at the top of the info card ───────────────────────
terminal_prompt: "fortune@github:~$"

# ── Links (used in README.md generation) ────────────────────────────────────
links:
  linkedin: "https://www.linkedin.com/in/fortune-c/"
  twitter:  "https://x.com/fortunevm"
  github:   "https://github.com/fortune-c"

# ── Portrait / ASCII settings ────────────────────────────────────────────────
portrait:
  source_path:       "assets/profile.png"
  cleaned_path:      "assets/profile_clean.png"
  ascii_width_chars: 72
  char_height_ratio: 0.55
  brightness_ramp:   " .`:-=+*cs#%@"


# ── GitHub Actions ────────────────────────────────────────────────────────────
actions:
  python_version: "3.11"
