name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        env:
          GIT_COMMIT_USER_NAME: ${{ secrets.USER_NAME }}
          GIT_COMMIT_USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |-
          git add .
          git config --global user.email "${GIT_COMMIT_USER_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git config --global user.name "${GIT_COMMIT_USER_NAME:-github-actions[bot]}"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:main
