name: Update Profile Art

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Daily at 04:00 UTC
  schedule:
    - cron: "0 4 * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      skip_photo_prep:
        description: "Skip photo pre-processing (faster, uses cached profile_clean.png)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# ─── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to push the auto-commit

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  regenerate:
    name: Regenerate Profile README
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # ── 4. (Optional) Pre-process portrait ─────────────────────────────────
      - name: Pre-process portrait photo
        if: >-
          github.event_name == 'schedule' ||
          github.event.inputs.skip_photo_prep == 'false'
        run: python scripts/prep_photo.py
        env:
          U2NET_HOME: ${{ runner.temp }}/.u2net

      # Cache the rembg model between runs
      - name: Cache rembg model weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.u2net
          key: u2net-model-v1

      # ── 5. Generate ASCII art text ──────────────────────────────────────────
      - name: Generate ASCII art text
        run: python scripts/make_ascii_text.py

      # ── 6. Generate README.md ───────────────────────────────────────────────
      - name: Generate README.md
        run: python scripts/make_readme.py

      # ── 7. Commit & push ────────────────────────────────────────────────────
      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            generated/ascii-art.txt \
            README.md \
            assets/profile_clean.png || true

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit – skipping."
          else
            git commit -m "chore: regenerate profile README [skip ci]"
            git push
          fi
